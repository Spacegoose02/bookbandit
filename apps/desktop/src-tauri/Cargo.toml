[package]
name = "bookbandit-desktop"
version = "0.1.0"
description = "BookBandit for Windows: reads from your family's BookBandit server, with offline books"
authors = ["BookBandit"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bookbandit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs"] }
url = "2"
cookie = "0.18"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
