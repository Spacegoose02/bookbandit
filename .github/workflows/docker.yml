name: Docker image

# PRs: build for amd64 and run the smoke test (nothing is pushed).
# main: build amd64 + arm64 and push ghcr.io/<owner>/bookbandit:latest, :main and :sha-<short>.
# Tags v1.2.3: also push :1.2.3, :1.2 and :1, then create the GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Pass the current Calibre release in explicitly so a new Calibre busts the build cache.
      - name: Current Calibre version
        id: calibre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api repos/kovidgoyal/calibre/releases/latest --jq '.tag_name | ltrimstr("v")')"
          test -n "$version"
          echo "Calibre $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build for amd64 (for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bookbandit:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CALIBRE_VERSION=${{ steps.calibre.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker/smoke-test.sh bookbandit:smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 + arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CALIBRE_VERSION=${{ steps.calibre.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags only: once the images are pushed, create the GitHub Release page with generated notes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=()
          also="Also tagged \`$(echo "$version" | cut -d. -f1-2)\` and \`${version%%.*}\`."
          case "$version" in *-*) prerelease=(--prerelease); also="Pre-release, so no short version tags." ;; esac
          cat > notes.md <<NOTES
          ## Docker image

          \`\`\`
          docker pull ${image}:${version}
          \`\`\`

          Multi-arch: linux/amd64 and linux/arm64. ${also}

          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Bookbandit $version" --notes-file notes.md --generate-notes "${prerelease[@]}"
